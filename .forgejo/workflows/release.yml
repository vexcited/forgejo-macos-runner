name: Release

on:
  push:
    tags:
      - "*.*.*"

env:
  APP: build/Build/Products/Release/Forgejo Runner.app

jobs:
  release:
    runs-on: macos-arm64

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - run: brew install xcodegen
      - run: xcodegen generate

      - name: build the release app
        run: |
          xcodebuild \
            -project ForgejoRunner.xcodeproj \
            -scheme ForgejoRunner \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - uses: https://github.com/Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          p12-password: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}

      - name: sign the app
        run: |
          set -euo pipefail
          sign() {
            codesign --force --timestamp --options runtime --sign "Developer ID Application" "$@"
          }

          # nested code is signed before the bundle that contains it.
          for tool in forgejo-one-job forgejo-guest-provision; do
            sign --identifier "com.vexcited.forgejo.runner.$tool" "$APP/Contents/Resources/$tool"
          done
          sparkle="$APP/Contents/Frameworks/Sparkle.framework"
          sign "$sparkle/Versions/B/XPCServices/Installer.xpc"
          sign --preserve-metadata=entitlements "$sparkle/Versions/B/XPCServices/Downloader.xpc"
          sign "$sparkle/Versions/B/Autoupdate"
          sign "$sparkle/Versions/B/Updater.app"
          sign "$sparkle"
          sign "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: notarize the app and its disk image
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p .signing .dmg dist
          printf '%s' "$API_KEY" | base64 --decode > .signing/api-key.p8
          credentials=(--key .signing/api-key.p8 --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")

          # submits a file, prints apple's log when it is rejected, then staples the ticket.
          notarize() {
            local result=".signing/notarization.json"
            xcrun notarytool submit "$1" "${credentials[@]}" \
              --wait --timeout 1h --output-format json > "$result" || true
            cat "$result"
            if [ "$(jq -r '.status // empty' "$result")" != Accepted ]; then
              id="$(jq -r '.id // empty' "$result")"
              [ -n "$id" ] && xcrun notarytool log "$id" "${credentials[@]}"
              echo "notarization of $1 was not accepted." >&2
              exit 1
            fi
            xcrun stapler staple "$2"
          }

          ditto -c -k --keepParent "$APP" .signing/app.zip
          notarize .signing/app.zip "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

          dmg="dist/ForgejoRunner-$FORGEJO_REF_NAME.dmg"
          ditto "$APP" ".dmg/Forgejo Runner.app"
          ln -s /Applications .dmg/Applications
          diskutil image create from --volumeName "Forgejo Runner" --format ULFO .dmg "$dmg"
          codesign --force --timestamp --sign "Developer ID Application" "$dmg"
          notarize "$dmg" "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          echo "DMG=$dmg" >> "$FORGEJO_ENV"

      - uses: https://code.vexcited.com/forgejo/upload-release-assets@v1
        with:
          files: dist/*.dmg

      - name: install the sparkle tools
        env:
          SPARKLE_VERSION: 2.10.0
          SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
        run: |
          set -euo pipefail
          curl -sSfL -o .signing/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  .signing/sparkle.tar.xz" | shasum -a 256 --check
          mkdir -p .signing/sparkle
          tar -xf .signing/sparkle.tar.xz -C .signing/sparkle

      - name: publish the update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TOKEN: ${{ forgejo.token }}
        run: |
          set -euo pipefail
          release="$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY/releases"
          mkdir -p .appcast
          cp "$DMG" .appcast/
          printf '%s' "$SPARKLE_PRIVATE_KEY" | .signing/sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "$release/download/$FORGEJO_REF_NAME/" \
            --full-release-notes-url "$release" \
            --maximum-versions 1 \
            .appcast

          cd .appcast
          git init -q -b appcast
          git add appcast.xml
          git -c user.name="Forgejo Actions" -c user.email="actions@noreply.${FORGEJO_SERVER_URL#https://}" \
            commit -q -m "chore: publish $FORGEJO_REF_NAME"
          git push --force -q "https://oauth2:$TOKEN@${FORGEJO_SERVER_URL#https://}/$FORGEJO_REPOSITORY.git" appcast

      - name: clean up
        if: always()
        run: rm -rf .signing .dmg .appcast
