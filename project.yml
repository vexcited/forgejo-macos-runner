name: ForgejoRunner

options:
  createIntermediateGroups: true
  xcodeVersion: "27.0"
  deploymentTarget:
    macOS: "15.0"

settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    CLANG_ENABLE_MODULES: YES
    DEAD_CODE_STRIPPING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    REGISTER_APP_GROUPS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"

targets:
  ForgejoRunner:
    type: application
    platform: macOS
    sources:
      - path: Sources/ForgejoRunner
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Resources/MacOSReleases.xcassets
    dependencies:
      - target: GuestKit
      - target: ForgejoOneJob
        copy:
          destination: resources
      - target: GuestProvision
        copy:
          destination: resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Forgejo Runner
        CFBundleName: Forgejo Runner
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "15.0"
        LSMultipleInstancesProhibited: true
        NSHighResolutionCapable: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.vexcited.forgejo.runner
        PRODUCT_NAME: Forgejo Runner
        PRODUCT_MODULE_NAME: ForgejoRunner
        CODE_SIGN_STYLE: Automatic

  GuestKit:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/GuestKit
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_INSTALL_OBJC_HEADER: NO

  ForgejoOneJob:
    type: tool
    platform: macOS
    sources:
      - path: Sources/ForgejoOneJob
    dependencies:
      - target: GuestKit
    settings:
      base:
        PRODUCT_NAME: forgejo-one-job
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SKIP_INSTALL: YES

  GuestProvision:
    type: tool
    platform: macOS
    sources:
      - path: Sources/GuestProvision
    dependencies:
      - target: GuestKit
    settings:
      base:
        PRODUCT_NAME: forgejo-guest-provision
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SKIP_INSTALL: YES
